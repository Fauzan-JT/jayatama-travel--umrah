<style>

.empty{text-align:center;color:var(--mut);padding:28px}
.dl{display:grid;gap:10px}.chk{display:flex;gap:10px;align-items:flex-start;font-size:13px}.chk input{width:20px;height:20px;margin-top:2px;accent-color:var(--pri);flex:none}
@media(max-width:1100px){.grid3{grid-template-columns:1fr}.kpi{grid-template-columns:repeat(2,1fr)}}
@media(max-width:900px){.side{width:76px;padding:16px 8px}.brand div,#nav button span,.cta{display:none}.brand{justify-content:center;padding-inline:0}#nav button{justify-content:center;padding:6px}}
@media(max-width:720px){.shell{flex-direction:column-reverse}.side{position:fixed;bottom:0;left:0;right:0;width:100%;flex-direction:row;border:0;border-top:1px solid var(--line);background:var(--bg);z-index:20;padding:6px 6px calc(6px + env(safe-area-inset-bottom));justify-content:space-around}
 .brand{display:none}#nav{flex-direction:row;justify-content:space-around;width:100%}#nav button{flex-direction:column;gap:2px;min-width:44px;min-height:52px;border-radius:16px;font-size:10px;padding:4px 2px}#nav button span{display:block}#nav button i{width:30px;height:30px}
 .main{padding-bottom:84px}.content{padding:16px}.top{padding:10px 14px}.user span:last-child{display:none}.fg,.charts{grid-template-columns:1fr}h1{font-size:24px;line-height:30px}
 .pk{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px}.pk .pc{min-width:78%;scroll-snap-align:start}.shell{margin:0}}
@media(max-width:720px){.shell,.main,.content{max-width:100vw;min-width:0}.main{overflow-x:hidden}.top{gap:6px}.search{min-width:0;padding:0 12px}.search input{width:100%}.ib{width:44px;flex:none}.tabs{flex-wrap:nowrap;overflow-x:auto;max-width:100%}.tabs button{flex:none}.row{min-width:0}.btn{max-width:100%}}
.ms{overflow:hidden;width:1em;white-space:nowrap}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{.side,.top,.btn,.ib,.tabs,#toasts{display:none!important}.shell{display:block}body{background:#fff}}
</style>

<body>
<div class="shell">
  <aside class="side" id="side">
    <div class="brand"><span class="logo ms">mosque</span><div><b>Jayatama</b><small>Umrah &amp; Hajj</small></div></div>
    <nav id="nav"></nav>
    <div class="cta" id="cta"><span class="chip"><i class="ms">stars</i>Siap berangkat umrah?</span><p>Amankan kursi dan pengurusan visa ibadah keluarga Anda lebih awal.</p><button class="btn" data-go="daftar">Daftar Sekarang</button></div>
  </aside>
  <div class="main">
    <header class="top">
      <label class="search"><i class="ms">search</i><input id="q" type="search" placeholder="Cari paket umrah, hotel, bulan..." aria-label="Cari paket"></label>
      <button class="ib" id="tema" aria-label="Ganti tema"><i class="ms">dark_mode</i></button>
      <button class="ib" data-go="kontak" aria-label="Pesan"><i class="ms">chat_bubble</i></button>
      <button class="user" id="userBox" data-go="login"><span class="av" id="avatar">T</span><span><b id="uNama">Tamu</b><small id="uPeran">Calon Jamaah</small></span></button>
    </header>
    <div class="content">
      <section id="s-home" class="sec"></section>
      <section id="s-paket" class="sec" hidden></section>
      <section id="s-daftar" class="sec" hidden></section>
      <section id="s-status" class="sec" hidden></section>
      <section id="s-materi" class="sec" hidden></section>
      <section id="s-kontak" class="sec" hidden></section>
      <section id="s-login" class="sec" hidden></section>
      <section id="s-admin" class="sec" hidden></section>
    </div>
  </div>
</div>
<div class="modal" id="modal" hidden role="dialog" aria-modal="true"><div class="box"><div class="mh"><b id="mTitle"></b><button class="ib" id="mClose" aria-label="Tutup"><i class="ms">close</i></button></div><div id="mBody"></div><div class="mf" id="mFoot"></div></div></div>
<div id="toasts" aria-live="polite"></div>
<div id="busy" hidden><div class="spin"></div></div>
<script>
/* JAYATAMA TRAVEL — SPA klien (versi Vercel). Backend: Google Apps Script Web App via fetch. */

/* >>> ISI DENGAN URL WEB APP APPS SCRIPT ANDA (berakhiran /exec) <<< */
const API_URL ='https://script.google.com/macros/s/AKfycbzkkXzCMLR9JKx6drEqnfT4ffhHx9my8PbA8HqFWRbTdJLeb47Gsg2PBd9fyDorqjfF/exec';

const $ = (s, r = document) => r.querySelector(s), qsa = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[<>&"']/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;', "'": '&#39;' }[c]));
const rp = n => 'Rp ' + Number(n || 0).toLocaleString('id-ID');
const tgl = d => { const x = new Date(d); return isNaN(x) ? '-' : x.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }); };
const MEM = {};
const LS = { get: (k, d) => { try { const v = localStorage.getItem(k); return v === null ? (k in MEM ? MEM[k] : d) : JSON.parse(v); } catch (e) { return k in MEM ? MEM[k] : d; } }, set: (k, v) => { MEM[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }, del: k => { delete MEM[k]; try { localStorage.removeItem(k); } catch (e) {} }, raw: k => { try { return localStorage.getItem(k); } catch (e) { return null; } } };
const S = { pub: LS.get('jt_pub', null), tok: null, user: null, adm: null, page: 'home', tab: 'pop', q: '', step: 1, form: LS.get('jt_draft', { jk: 'Laki-laki' }), files: {}, bulan: new Date(2026, 10, 1), at: 'dash', pn: 1 };
const NAV = [['home', 'Beranda', 'home'], ['paket', 'Paket Umrah', 'flight_takeoff'], ['daftar', 'Pendaftaran', 'assignment'], ['status', 'Cek Status', 'verified'], ['materi', 'Materi Panduan', 'menu_book'], ['kontak', 'Kontak', 'headset_mic']];
let busyN = 0;
const busy = on => { busyN += on ? 1 : -1; $('#busy').hidden = busyN <= 0; };
function toast(m, er) { const t = document.createElement('div'); t.className = 'toast' + (er ? ' er' : ''); t.textContent = m; $('#toasts').append(t); setTimeout(() => t.remove(), 4200); }
/** Pembungkus API: kirim ke Google Apps Script (Web App) via fetch. Sesi habis -> login, error -> toast. */
function call(fn, args, ok, silent) {
  busy(true);
  if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(API_URL)) {
    busy(false); if (!silent) toast('API_URL belum diisi di index.html (lihat PANDUAN.md).', 1); return;
  }
  const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 60000);
  fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args || [] }), signal: ctl.signal })
    .then(res => res.text())
    .then(txt => { try { return JSON.parse(txt); } catch (e) { throw new Error('Respons server bukan JSON. Pastikan Web App di-deploy dengan akses "Siapa saja" dan URL berakhiran /exec.'); } })
    .then(r => ({ r: r }), err => ({ err: err }))
    .then(x => {
      clearTimeout(tm); busy(false);
      if (x.err) { if (!silent) toast('Koneksi gagal: ' + (x.err.name === 'AbortError' ? 'waktu habis' : x.err.message), 1); return; }
      const r = x.r;
      if (r && r.success) { ok && ok(r.data, r.message); return; }
      if (r && r.message === 'SESI_HABIS') { S.tok = null; S.user = null; S.adm = null; toast('Sesi berakhir, silakan masuk lagi.', 1); go('login'); }
      else if (!silent) toast((r && r.message) || 'Terjadi kesalahan.', 1);
    });
}
const sa = (p, v) => { const a = $(p); if (a) a.hidden = !v; };

/* ---------- Router (SPA murni, tanpa reload/URL) ---------- */
function go(p) {
  clearTimeout(S.dt); S.page = p; qsa('.sec').forEach(s => s.hidden = s.id !== 's-' + p);
  const R = { home: pgHome, paket: pgPaket, daftar: pgDaftar, status: pgStatus, materi: pgMateri, kontak: pgKontak, login: pgLogin, admin: pgAdmin }[p]; R && R();
  qsa('#nav button').forEach(b => b.classList.toggle('on', b.dataset.go === p)); $('.content').scrollTop = 0; window.scrollTo(0, 0);
}
function navRender() {
  const items = NAV.concat(S.user ? [['admin', S.user.peran === 'Admin' ? 'Admin' : 'Laporan', 'admin_panel_settings']] : []);
  $('#nav').innerHTML = items.map(n => `<button data-go="${n[0]}" aria-label="${n[1]}"><i class="ms">${n[2]}</i><span>${n[1]}</span></button>`).join('');
  $('#uNama').textContent = S.user ? S.user.nama : 'Tamu'; $('#uPeran').textContent = S.user ? S.user.peran : 'Calon Jamaah'; $('#avatar').textContent = (S.user ? S.user.nama : 'T')[0].toUpperCase();
}
document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]'); if (g) { go(g.dataset.go); return; }
  const a = e.target.closest('[data-act]'); if (a && A[a.dataset.act]) A[a.dataset.act](a.dataset, a, e);
});

/* ---------- Util tampilan ---------- */
const P = () => (S.pub && S.pub.paket) || [];

function pgLogin() {
  $('#s-login').innerHTML = S.user ? `<div class="card" style="max-width:480px"><h1>${esc(S.user.nama)}</h1><span class="badge b-go">${S.user.peran}</span><div class="sp"></div><div class="f"><label for="pinB">Ganti PIN (min. 6 digit)</label><input id="pinB" type="password" inputmode="numeric"></div><div class="sp"></div><div class="row"><button class="btn soft" data-act="pin">Simpan PIN</button><button class="btn red" data-act="logout">Keluar</button></div></div>`
    : `<div class="card" style="max-width:440px"><h1>Masuk Staf / Pimpinan</h1><p><small>Gunakan email terdaftar dan PIN.</small></p><div class="sp"></div><div class="f"><label for="lE">Email</label><input id="lE" type="email" autocomplete="username"></div><div class="sp"></div><div class="f"><label for="lP">PIN</label><input id="lP" type="password" inputmode="numeric" autocomplete="current-password"></div><div class="sp"></div><button class="btn" style="width:100%" data-act="masuk">Masuk</button></div>`;
}
Object.assign(A, {
  masuk: () => call('login', [$('#lE').value, $('#lP').value], d => { S.tok = d.token; S.user = { nama: d.nama, peran: d.peran }; navRender(); toast('Selamat datang, ' + d.nama); S.at = 'dash'; go('admin'); }),
  logout: () => { S.tok = null; S.user = null; S.adm = null; navRender(); go('home'); },
  pin: () => call('gantiPin', [S.tok, $('#pinB').value], (d, m) => toast(m)),
});
const isA = () => S.user && S.user.peran === 'Admin';
function loadAdm(cb) { call('getAdmin', [S.tok], d => { S.adm = d; cb && cb(); }); }
function pgAdmin() {
  if (!S.user) return go('login');
  if (!S.adm) { $('#s-admin').innerHTML = skel; return loadAdm(pgAdmin); }
  const T = [['dash', 'Dashboard']].concat(isA() ? [['ver', 'Verifikasi'], ['jam', 'Data Jamaah'], ['pkt', 'Kelola Paket'], ['mat', 'Materi'], ['crm', 'CRM & Notifikasi'], ['usr', 'Pengguna'], ['mig', 'Migrasi']] : [['jam', 'Data Jamaah']]);
  const V = { dash: vDash, ver: vVer, jam: vJam, pkt: vPkt, mat: vMat, crm: vCrm, usr: vUsr, mig: vMig }[S.at] || vDash;
  $('#s-admin').innerHTML = `<div class="row between"><div><span class="chip"><i class="ms">admin_panel_settings</i>SISTEM OPERASIONAL TERPADU JAYATAMA</span><h1 style="margin-top:8px">${isA() ? 'Panel Admin' : 'Laporan Pimpinan'}</h1></div><button class="btn soft pill" data-act="muat"><i class="ms">refresh</i>Muat Ulang</button></div><div class="sp"></div><div class="tabs">${T.map(t => `<button class="${S.at === t[0] ? 'on' : ''}" data-act="at" data-t="${t[0]}">${t[1]}</button>`).join('')}</div><div class="sp"></div>${V()}`;
  if (S.at === 'dash') drawCharts();
}
A.at = d => { S.at = d.t; S.pn = 1; pgAdmin(); }; A.muat = () => { S.adm = null; pgAdmin(); };
const pn = id => (S.adm.paket.find(p => p.ID_Paket === id) || {}).Nama_Paket || id;
function vDash() {
  const r = S.adm.ringkas;
  return `<div class="kpi"><div class="card pri"><small>Total Pendaftar</small><b>${r.total}</b></div><div class="card"><small>Menunggu Verifikasi</small><b>${r.menunggu}</b></div><div class="card"><small>Terverifikasi</small><b>${r.verif}</b></div><div class="card"><small>Estimasi Nilai Penjualan</small><b style="font-size:22px">${rp(r.nilai)}</b></div></div><div class="sp"></div>
  <div class="charts"><div class="card"><h2>Tren Pendaftar per Bulan</h2><div id="c1"></div></div><div class="card"><h2>Penjualan per Paket</h2><div id="c2"></div></div><div class="card"><h2>Progres Kelengkapan Dokumen</h2><div id="c3"></div></div><div class="card"><h2>Sisa Kuota per Keberangkatan</h2><div id="c4"></div></div></div>`;
}
function drawCharts() {
  const a = S.adm, ks = Object.keys(a.bulan).sort(), vs = ks.map(k => a.bulan[k]), mx = Math.max(1, ...vs), W = 420, H = 180;
  const pts = vs.map((v, i) => [30 + i * ((W - 60) / Math.max(1, vs.length - 1)), H - 30 - (v / mx) * (H - 60)]);
  $('#c1').innerHTML = vs.length ? `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Tren pendaftar"><polyline fill="none" stroke="#5B4BB7" stroke-width="3" points="${pts.map(p => p.join(',')).join(' ')}"/>${pts.map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="#fff" stroke="#5B4BB7" stroke-width="3"><title>${ks[i]}: ${vs[i]}</title></circle><text x="${p[0]}" y="${p[1] - 10}" font-size="11" text-anchor="middle" fill="currentColor">${vs[i]}</text><text x="${p[0]}" y="${H - 8}" font-size="10" text-anchor="middle" fill="#9A98B0">${ks[i].slice(2)}</text>`).join('')}</svg>` : '<div class="empty">Belum ada data.</div>';
  const mp = Math.max(1, ...a.perPaket.map(p => p.jml));
  $('#c2').innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="100%">${a.perPaket.map((p, i) => { const bw = (W - 40) / a.perPaket.length, h = p.jml / mp * (H - 60); return `<rect x="${20 + i * bw + 8}" y="${H - 30 - h}" width="${bw - 16}" height="${h}" rx="8" fill="#5B4BB7"><title>${esc(p.nama)}: ${p.jml} jamaah, ${rp(p.nilai)}</title></rect><text x="${20 + i * bw + bw / 2}" y="${H - 34 - h}" font-size="11" text-anchor="middle" fill="currentColor">${p.jml}</text><text x="${20 + i * bw + bw / 2}" y="${H - 12}" font-size="10" text-anchor="middle" fill="#9A98B0">${esc(p.nama.split(' ').slice(1, 3).join(' '))}</text>`; }).join('')}</svg>`;
  const d = a.dokStat, tot = (d.Disetujui || 0) + (d.Menunggu || 0) + (d.Ditolak || 0), seg = [['Disetujui', '#5B4BB7'], ['Menunggu', '#F5B942'], ['Ditolak', '#B91C1C']];
  let off = 0; const C = 2 * Math.PI * 50;
  $('#c3').innerHTML = tot ? `<div class="row"><svg viewBox="0 0 120 120" width="150"><g transform="rotate(-90 60 60)">${seg.map(s => { const l = (d[s[0]] || 0) / tot * C, e = `<circle cx="60" cy="60" r="50" fill="none" stroke="${s[1]}" stroke-width="18" stroke-dasharray="${l} ${C - l}" stroke-dashoffset="${-off}"/>`; off += l; return e; }).join('')}</g><text x="60" y="66" text-anchor="middle" font-size="20" font-weight="700" fill="currentColor">${Math.round((d.Disetujui || 0) / tot * 100)}%</text></svg><div class="list">${seg.map(s => `<div><span style="color:${s[1]}">●</span> ${s[0]}: <b>${d[s[0]] || 0}</b></div>`).join('')}</div></div>` : '<div class="empty">Belum ada dokumen.</div>';
  $('#c4').innerHTML = `<div class="list">${a.paket.map(p => { const x = a.perPaket.find(q => q.nama === p.Nama_Paket) || { jml: 0, kuota: 1 }; return `<div><div class="row between"><small>${esc(p.Nama_Paket)}</small><small>${x.kuota - x.jml} / ${x.kuota} kursi</small></div><div class="bar" style="background:var(--tint)"><i style="width:${Math.round(x.jml / x.kuota * 100)}%;background:var(--pri)"></i></div></div>`; }).join('')}</div>`;
}
function tbl(head, rows, name) { const per = 10, pg = Math.max(1, Math.ceil(rows.length / per)); S.pn = Math.min(S.pn, pg); return `<div class="row between"><input class="search" style="padding:0 16px" id="fq" placeholder="Cari…" value="${esc(S.fq || '')}" aria-label="Cari"><div class="row"><button class="btn soft sm" data-act="xls" data-n="${name}"><i class="ms" style="font-size:18px">table_view</i>Unduh Excel</button><button class="btn soft sm" data-act="pdf"><i class="ms" style="font-size:18px">picture_as_pdf</i>Unduh PDF</button></div></div><div class="sp"></div><div class="tw"><table id="tbl"><thead><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.slice((S.pn - 1) * per, S.pn * per).map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('') || `<tr><td colspan="${head.length}" class="empty">Tidak ada data.</td></tr>`}</tbody></table></div><div class="row between" style="margin-top:10px"><small>Halaman ${S.pn} / ${pg} • ${rows.length} data</small><div class="row"><button class="ib" data-act="pg" data-d="-1" aria-label="Sebelumnya"><i class="ms">chevron_left</i></button><button class="ib" data-act="pg" data-d="1" aria-label="Berikutnya"><i class="ms">chevron_right</i></button></div></div>`; }
document.addEventListener('keydown', e => { if (e.target.id === 'fq' && e.key === 'Enter') { S.fq = e.target.value; S.pn = 1; pgAdmin(); } });
A.pg = d => { S.pn = Math.max(1, S.pn + Number(d.d)); pgAdmin(); };
A.xls = d => { const t = $('#tbl').cloneNode(true); qsa('button,label', t).forEach(x => x.remove()); const b = new Blob(['\ufeff<html><meta charset="utf-8"><body>' + t.outerHTML + '</body></html>'], { type: 'application/vnd.ms-excel' }), a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'jayatama_' + d.n + '.xls'; a.click(); };
A.pdf = () => window.print();
const fl = (l) => { const q = (S.fq || '').toLowerCase(); return q ? l.filter(r => JSON.stringify(r).toLowerCase().includes(q)) : l; };
function vJam() { const l = fl(S.adm.jamaah); return tbl(['ID', 'Nama', 'Paket', 'Status', 'Tanggal'].concat(isA() ? ['Paspor', 'Ubah Status'] : []), l.map(j => [esc(j.id), esc(j.nama), esc(pn(j.paket)), `<span class="badge ${bdg(j.status)}">${esc(j.status)}</span>`, tgl(j.tgl)].concat(isA() ? [esc(j.paspor), `<select data-st="${esc(j.id)}" aria-label="Status">${['Draft', 'Menunggu Verifikasi', 'Perlu Perbaikan', 'Terverifikasi', 'Siap Berangkat', 'Batal'].map(s => `<option ${s === j.status ? 'selected' : ''}>${s}</option>`).join('')}</select>`] : [])), 'jamaah'); }
function vVer() { const nm = {}; S.adm.jamaah.forEach(j => nm[j.id] = j.nama); const l = fl(S.adm.dokumen.slice().sort((a, b) => (a.Status_Verifikasi === 'Menunggu' ? -1 : 1))); return tbl(['Jamaah', 'Dokumen', 'Upload', 'Status', 'Catatan', 'Tindakan'], l.map(d => [esc(nm[d.ID_Jamaah] || d.ID_Jamaah) + '<br><small>' + esc(d.ID_Jamaah) + '</small>', esc(d.Jenis_Dokumen), tgl(d.Tanggal_Upload), `<span class="badge ${bdg(d.Status_Verifikasi)}">${esc(d.Status_Verifikasi)}</span>`, esc(d.Catatan_Admin), `<button class="btn sm" data-act="lihat" data-id="${esc(d.ID_Dokumen)}"><i class="ms" style="font-size:18px">visibility</i>Lihat &amp; Verifikasi</button>`]), 'verifikasi'); }
A.lihat = d => call('pratinjauDokumen', [S.tok, d.id], r => modal('Verifikasi: ' + r.nama, `<div style="text-align:center">${r.mime.startsWith('image') ? `<img src="${r.url}" alt="Dokumen" style="max-width:100%;max-height:55vh;border-radius:12px">` : `<iframe src="${r.url}" title="Dokumen" style="width:100%;height:55vh;border:0"></iframe>`}</div><div class="f"><label for="cat">Catatan (wajib jika ditolak)</label><input id="cat"></div>`, `<button class="btn red" data-act="vf" data-id="${esc(d.id)}" data-s="Ditolak">Tolak</button><button class="btn" data-act="vf" data-id="${esc(d.id)}" data-s="Disetujui">Setujui</button>`));
A.vf = d => call('verifikasiDokumen', [S.tok, d.id, d.s, $('#cat').value], (x, m) => { toast(m); modal(); S.adm = null; pgAdmin(); });
document.addEventListener('change', e => { if (e.target.dataset.st) call('ubahStatus', [S.tok, e.target.dataset.st, e.target.value], (d, m) => { toast(m); const j = S.adm.jamaah.find(x => x.id === e.target.dataset.st); if (j) j.status = e.target.value; }); });
function vPkt() { return `<div class="row between"><h2>Paket Umrah</h2><button class="btn pill" data-act="editP" data-id=""><i class="ms">add</i>Tambah Paket</button></div><div class="sp"></div>` + tbl(['ID', 'Nama', 'Harga', 'Durasi', 'Berangkat', 'Kuota', 'Status', ''], S.adm.paket.map(p => [esc(p.ID_Paket), esc(p.Nama_Paket), rp(p.Harga), p.Durasi, tgl(p.Tanggal_Keberangkatan), p.Kuota, `<span class="badge ${bdg(p.Status_Aktif)}">${p.Status_Aktif}</span>`, `<button class="btn soft sm" data-act="editP" data-id="${esc(p.ID_Paket)}">Ubah</button>`]), 'paket'); }
A.editP = d => { const p = S.adm.paket.find(x => x.ID_Paket === d.id) || { Status_Aktif: 'Aktif' }; const F = [['Nama_Paket', 'Nama Paket'], ['Harga', 'Harga (Rp)'], ['Durasi', 'Durasi (hari)'], ['Tanggal_Keberangkatan', 'Tanggal Berangkat', 'date'], ['Kuota', 'Kuota'], ['Rating', 'Rating'], ['Hotel', 'Hotel'], ['Fasilitas', 'Fasilitas (pisahkan dengan |)'], ['Link_YouTube', 'Link YouTube']];
  modal(p.ID_Paket ? 'Ubah Paket' : 'Tambah Paket', `<div class="fg">${F.map(f => `<div class="f"><label>${f[1]}</label><input data-p="${f[0]}" type="${f[2] || 'text'}" value="${esc(f[2] === 'date' ? String(p[f[0]] || '').slice(0, 10) : p[f[0]] || '')}"></div>`).join('')}<div class="f"><label>Status</label><select data-p="Status_Aktif"><option ${p.Status_Aktif === 'Aktif' ? 'selected' : ''}>Aktif</option><option ${p.Status_Aktif === 'Nonaktif' ? 'selected' : ''}>Nonaktif</option></select></div></div>`, `<button class="btn" data-act="sp" data-id="${esc(p.ID_Paket || '')}">Simpan</button>`); };
A.sp = d => { const o = { ID_Paket: d.id }; qsa('[data-p]').forEach(i => o[i.dataset.p] = i.value); call('simpanPaket', [S.tok, o], (x, m) => { toast(m); modal(); S.adm = null; S.pub = null; refresh(); pgAdmin(); }); };
function vMat() { return `<div class="card"><h2>Unggah Materi (ZIP/JPG)</h2><div class="fg"><div class="f"><label for="mJ">Judul</label><input id="mJ"></div><div class="f"><label for="mF">Berkas (maks. 5 MB)</label><input id="mF" type="file" accept=".zip,image/jpeg,image/png,application/pdf"></div></div><div class="sp"></div><button class="btn" data-act="um">Unggah</button></div><div class="sp"></div>` + tbl(['Judul', 'Jenis', 'Tanggal'], S.adm.materi.map(m => [esc(m.Judul), m.Jenis, tgl(m.Tanggal_Upload)]), 'materi'); }
A.um = () => { const f = $('#mF').files[0]; if (!f || !$('#mJ').value) return toast('Isi judul dan pilih berkas.', 1); if (f.size > 5242880) return toast('Maksimal 5 MB.', 1); const r = new FileReader(); r.onload = () => call('uploadMateri', [S.tok, $('#mJ').value, { nama: f.name, mime: f.type || 'application/zip', data: r.result }], (d, m) => { toast(m); S.adm = null; S.pub = null; refresh(); pgAdmin(); }); r.readAsDataURL(f); };
function vCrm() { const c = S.adm.crm; return `<div class="row"><button class="btn soft" data-act="sync"><i class="ms">sync</i>Sinkronkan Kontak</button></div><div class="sp"></div><div class="card"><h2>Blast WhatsApp</h2><div class="f"><label for="bl">Pesan (gunakan {nama})</label><textarea id="bl" rows="3"></textarea></div><div class="sp"></div><button class="btn gold" data-act="blast"><i class="ms">send</i>Kirim ke Antrean</button><p><small>Perlu NOTIF_WA_AKTIF=YA (AppConfig) &amp; FONNTE_TOKEN (Script Properties). Kontak OptOut dikecualikan.</small></p></div><div class="sp"></div>` + tbl(['Kontak', 'WA', 'Segmen', 'Status WA', 'Opt-Out'], c.map(k => [esc(k.Nama) + '<br><small>' + esc(k.Email) + '</small>', esc(k.NoWA), esc(k.Segmen), esc(k.StatusWA), `<input type="checkbox" data-oo="${esc(k.KontakID)}" ${k.OptOut === 'YA' ? 'checked' : ''} aria-label="Opt-out ${esc(k.Nama)}" style="width:20px;height:20px;accent-color:var(--pri)">`]), 'crm') + `<div class="sp"></div><h2>Antrean Notifikasi Terakhir</h2><div class="sp"></div>` + `<div class="tw"><table><thead><tr><th>Kanal</th><th>Tujuan</th><th>Event</th><th>Status</th></tr></thead><tbody>${S.adm.antrian.map(a => `<tr><td>${a.Kanal}</td><td>${esc(a.Tujuan)}</td><td>${esc(a.Event)}</td><td><span class="badge ${a.Status === 'Terkirim' ? 'b-ok' : a.Status === 'Gagal' ? 'b-no' : 'b-wait'}">${a.Status}</span></td></tr>`).join('')}</tbody></table></div>`; }
A.sync = () => call('crmSync', [S.tok], (d, m) => { toast(m); S.adm = null; pgAdmin(); });
A.blast = () => { if (!$('#bl').value.trim()) return toast('Tulis pesan.', 1); call('blastWA', [S.tok, $('#bl').value], (d, m) => toast(m)); };
document.addEventListener('change', e => { if (e.target.dataset.oo) call('crmOptOut', [S.tok, e.target.dataset.oo, e.target.checked], (d, m) => toast(m)); });
function vUsr() { return `<div class="card"><h2>Tambah Pengguna</h2><div class="fg"><div class="f"><label>Nama</label><input id="uN"></div><div class="f"><label>Email</label><input id="uE" type="email"></div><div class="f"><label>Peran</label><select id="uR"><option>Admin</option><option>Pimpinan</option></select></div><div class="f"><label>PIN awal (min. 6 digit)</label><input id="uP" type="password" inputmode="numeric"></div></div><div class="sp"></div><button class="btn" data-act="au">Tambah</button></div><div class="sp"></div>` + tbl(['Nama', 'Email', 'Peran', 'Status'], S.adm.pengguna.map(u => [esc(u.nama), esc(u.email), u.peran, u.aktif]), 'pengguna'); }
A.au = () => call('simpanPengguna', [S.tok, { nama: $('#uN').value, email: $('#uE').value, peran: $('#uR').value, pin: $('#uP').value }], (d, m) => { toast(m); S.adm = null; pgAdmin(); });
function vMig() { return `<div class="card"><h2>Migrasi dari Spreadsheet Lama</h2><p><small>Sumber hanya dibaca. Gunakan Simulasi dahulu; impor aman diulang (upsert berdasarkan NIK + paket).</small></p><div class="f"><label for="mS">ID / URL spreadsheet lama (akun Google yang sama)</label><input id="mS"></div><div class="sp"></div><div class="row"><button class="btn soft" data-act="mg" data-dry="1">Simulasi (Dry-Run)</button><button class="btn" data-act="mg" data-dry="">Jalankan Migrasi</button></div><div class="sp"></div><div id="mR"></div></div>`; }
A.mg = d => call('migrasiJamaah', [S.tok, $('#mS').value, !!d.dry], (r, m) => { $('#mR').innerHTML = `<span class="badge b-go">${esc(m)}</span> Tambah: <b>${r.inserted}</b> • Perbarui: <b>${r.updated}</b> • Lewati: <b>${r.skipped}</b>`; if (!d.dry) { S.adm = null; } });

/* ---------- Boot: render instan dari cache lokal, sinkron di latar belakang ---------- */
function refresh() { call('getPublicData', [], d => { S.pub = d; LS.set('jt_pub', d); if (['home', 'paket', 'materi'].includes(S.page) || (S.page === 'daftar' && S.step === 2)) go(S.page); }, true); }
$('#q').addEventListener('input', e => { clearTimeout(S.dt); S.dt = setTimeout(() => { S.q = e.target.value; if (!['home', 'paket'].includes(S.page)) S.page = 'paket'; go(S.page); }, 300); });
$('#tema').onclick = () => { const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = t; LS.set('jt_tema', t); $('#tema i').textContent = t === 'dark' ? 'light_mode' : 'dark_mode'; };
(() => { const t = LS.get('jt_tema', null); if (t) { document.documentElement.dataset.theme = t; $('#tema i').textContent = t === 'dark' ? 'light_mode' : 'dark_mode'; } })();
S.cek = { kode: '', wa4: '' };
function fatal(m) { const c = $('#s-home'); if (c) { c.hidden = false; c.innerHTML = '<div class="card"><h2>Terjadi kesalahan tampilan</h2><p><small>' + esc(m) + '</small></p><button class="btn" onclick="location.reload()">Muat Ulang</button></div>'; } }
window.addEventListener('error', e => { if (!$('#nav').children.length) fatal(e.message); });
try { navRender(); go('home'); } catch (e) { fatal(e.message); }
try { refresh(); } catch (e) {}
</script>
</body>
</html>
